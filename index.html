<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC28</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0f172a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #splash-screen.hidden { opacity: 0; pointer-events: none; }
        .splash-img {
            width: 70vw; max-width: 350px; height: auto; margin-bottom: 30px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .enter-btn {
            padding: 14px 50px; font-size: 18px; font-weight: bold; color: #0f172a;
            background: #f59e0b; border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); transition: all 0.2s;
        }
        .enter-btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3); }

        body {
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0; padding: 20px;
        }
        #main-app { display: none; flex-direction: column; align-items: center; width: 100%; }

        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 20px;
            padding: 30px 40px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            width: 100%; max-width: 500px; margin-bottom: 20px;
        }
        .header-label { font-size: 14px; color: #94a3b8; letter-spacing: 1px; margin-bottom: 8px; }
        .issue { font-size: 36px; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums; margin-bottom: 20px; }
        .result-box { background: #0f172a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        .nums { font-size: 32px; font-weight: 700; color: #f8fafc; letter-spacing: 2px; margin-bottom: 10px; }
        .nums span { color: #f97316; }
        
        .kill-box { background: #0f172a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px dashed #f59e0b; }
        .kill-title { font-size: 14px; color: #f59e0b; margin-bottom: 10px; }
        .kill-target { font-size: 32px; font-weight: bold; color: #38bdf8; }
        .kill-result { font-size: 24px; font-weight: bold; color: #ef4444; margin-top: 10px; }
        
        .streak-highlight {
            margin-top: 15px; padding: 8px 12px; background: #422006; border: 1px solid #f59e0b;
            border-radius: 8px; color: #fcd34d; font-size: 16px; font-weight: bold; display: inline-block;
        }

        .countdown-box { border-top: 1px solid #334155; padding-top: 20px; margin-bottom: 20px; }
        .countdown-label { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .countdown { font-size: 28px; font-weight: 700; color: #22c55e; font-variant-numeric: tabular-nums; }
        .countdown.urgent { color: #f97316; }
        
        .refresh-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: #3b82f6; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: background 0.2s; margin-bottom: 10px;
        }
        .refresh-btn:hover { background: #2563eb; }

        .scratch-trigger-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: #f59e0b; color: #0f172a; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: background 0.2s; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .scratch-trigger-btn:hover { background: #d97706; }
        
        .stats-card {
            background: #1e293b; border: 1px solid #334155; border-radius: 20px;
            padding: 20px; width: 100%; max-width: 500px; margin-bottom: 20px;
        }
        .stats-header { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .stats-summary { display: flex; justify-content: space-around; margin-bottom: 15px; background: #0f172a; padding: 10px; border-radius: 10px; }
        .stat-item { text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; }
        .val-green { color: #22c55e; }
        .val-red { color: #ef4444; }
        
        .history-container { border: 1px solid #334155; border-radius: 10px; background: #0f172a; overflow: hidden; }
        .history-header { display: flex; padding: 10px; background: #1e293b; font-size: 12px; color: #64748b; border-bottom: 1px solid #334155; }
        .history-header > div { flex: 1; }
        .history-list { max-height: 350px; overflow-y: auto; }
        .history-row { display: flex; padding: 12px 10px; border-bottom: 1px solid #1e293b; font-size: 13px; align-items: center; }
        .history-row:last-child { border-bottom: none; }
        .history-row > div { flex: 1; }
        
        .col-issue { text-align: left; color: #94a3b8; }
        .col-actual { text-align: center; color: #38bdf8; font-weight: bold;}
        .col-kill { text-align: center; color: #f59e0b; font-weight: bold;}
        .col-result { text-align: right; font-weight: bold;}
        
        .tag-win { color: #22c55e; }
        .tag-lose { color: #ef4444; }
        .status { font-size: 12px; color: #64748b; margin-top: 10px; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); z-index: 10000; justify-content: center; align-items: center;
        }
        .modal.show { display: flex; }
        
        .modal-content {
            background: #1e293b; border: 1px solid #334155; padding: 30px 20px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; background: none; border: none;
            color: #94a3b8; font-size: 28px; cursor: pointer; line-height: 1;
        }
        .close-btn:hover { color: #fff; }
        
        .scratch-title { color: #f59e0b; font-weight: bold; margin-bottom: 20px; font-size: 18px; }
        
        .scratch-container {
            position: relative; width: 100%; height: 150px; border-radius: 12px;
            overflow: hidden; background: linear-gradient(135deg, #2c3e50, #000000); margin-bottom: 15px;
        }
        .scratch-prize {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; z-index: 1;
        }
        .scratch-nums-text { font-size: 32px; font-weight: 900; color: #f8fafc; margin-bottom: 8px; letter-spacing: 2px; }
        .scratch-result-text { font-size: 24px; font-weight: bold; color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        
        #scratch-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: crosshair; z-index: 2; touch-action: none; }

        .scratch-bottom-countdown { margin-top: 10px; font-size: 16px; font-weight: bold; color: #22c55e; }

        /* ===== 音乐模块 ===== */
        #music-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px;
            background: #1e293b; border: 1px solid #334155; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 99999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: transform 0.2s;
            overflow: hidden;
        }
        #music-btn:active { transform: scale(0.9); }
        #music-btn.playing { animation: rotate 3s linear infinite; border-color: #f59e0b; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        #music-btn img.avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

        #music-panel {
            position: fixed; bottom: 90px; right: 30px; width: 320px;
            background: #0a0a0a; border-radius: 12px; padding: 16px; z-index: 99998;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); display: none; flex-direction: column; gap: 8px;
        }
        #music-panel.show { display: flex; }

        .player-card { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
        .player-cover {
            width: 64px; height: 64px; border-radius: 50%; background: #ff6600;
            display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
        }
        .player-cover.spinning { animation: rotate 3s linear infinite; }
        .player-cover img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; }
        .player-title { font-size: 15px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 12px; color: #aaa; margin-top: 2px; }
        .player-lyric { font-size: 11px; color: #666; margin-top: 2px; }

        .music-progress-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
        .music-progress-time { font-size: 11px; color: #aaa; min-width: 36px; text-align: center; }
        .music-progress-bar {
            flex: 1; height: 6px; background: #333; border-radius: 3px;
            cursor: pointer; position: relative;
        }
        .music-progress-bar::before {
            content: ''; position: absolute; top: -10px; bottom: -10px; left: 0; right: 0;
        }
        .music-progress-fill {
            height: 100%; background: #f59e0b; border-radius: 3px; width: 0%;
            position: relative;
        }
        .music-progress-fill::after {
            content: ''; position: absolute; right: -7px; top: 50%; transform: translateY(-50%);
            width: 14px; height: 14px; background: #f59e0b; border-radius: 50%;
        }

        .music-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 4px; }
        .music-ctrl-btn {
            background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        .music-ctrl-btn:active { transform: scale(0.85); }
        .music-ctrl-btn.play-pause { font-size: 26px; }
        .music-ctrl-btn.active { color: #f59e0b; }

        .music-playlist { max-height: 120px; overflow-y: auto; margin-top: 4px; border-top: 1px solid #222; padding-top: 6px; }
        .music-list-item {
            display: flex; align-items: center; gap: 10px; padding: 6px 8px; cursor: pointer;
            border-radius: 6px; transition: background 0.2s;
        }
        .music-list-item:hover { background: #1a1a1a; }
        .music-list-item.list-active { background: #1a1a1a; }
        .music-list-item.list-active .list-name { color: #f59e0b; }
        .list-cover { width: 32px; height: 32px; border-radius: 50%; background: #ff6600; overflow: hidden; flex-shrink: 0; }
        .list-cover img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .list-name { font-size: 13px; color: #e2e8f0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .list-playing { display: none; width: 14px; height: 14px; align-items: flex-end; gap: 2px; }
        .music-list-item.list-active .list-playing { display: flex; }
        .list-playing span { display: block; width: 3px; background: #f59e0b; border-radius: 1px; animation: bounce 0.6s infinite alternate; }
        .list-playing span:nth-child(2) { animation-delay: 0.2s; }
        .list-playing span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="start.jpg" alt="进入" class="splash-img" onerror="this.src='https://img.picui.cn/free/2024/07/26/66a37c599fdfb.png';">
        <button class="enter-btn" onclick="enterSystem()">点击内射进入</button>
    </div>

    <div id="main-app">
        <div class="card">
            <div class="header-label">最新开奖期号</div>
            <div class="issue" id="issue">---</div>
            <div class="result-box">
                <div class="nums" id="nums">- + - + - <span>= -</span></div>
            </div>
            <div class="kill-box">
                <div class="kill-title">预测下一期期号</div>
                <div class="kill-target" id="nextIssue">---</div>
                <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
                    <div class="kill-title">预测杀组</div>
                    <div class="kill-result" id="killTarget">---</div>
                </div>
                <div class="streak-highlight">🔥 实时连中：<span id="topStreak">0</span> 期</div>
            </div>
            <div class="countdown-box">
                <div class="countdown-label">距下一期开奖还有</div>
                <div class="countdown" id="countdown">--</div>
            </div>
            
            <button class="refresh-btn" onclick="fetchData()">刷新数据</button>
            <button class="scratch-trigger-btn" onclick="openScratchModal()">点击刮奖</button>
            
            <div class="status" id="status"></div>
        </div>

        <div class="stats-card">
            <div class="stats-header">
                <span>近 50 期</span>
                <div style="display: flex; gap: 10px;">
                    <span id="headerStreak" style="font-size:14px; color:#f59e0b; font-weight:bold;">连中: 0 期</span>
                    <span id="accuracy" style="font-size:14px; color:#22c55e;">胜率: --</span>
                </div>
            </div>
            <div class="stats-summary">
                <div class="stat-item">
                    <div class="stat-val val-green" id="winCount">0</div>
                    <div style="font-size:12px; color:#94a3b8;">杀对</div>
                </div>
                <div class="stat-item">
                    <div class="stat-val val-red" id="loseCount">0</div>
                    <div style="font-size:12px; color:#94a3b8;">杀错</div>
                </div>
            </div>
            <div class="history-container">
                <div class="history-header">
                    <div class="col-issue">预测期号</div>
                    <div class="col-actual" style="text-align: center;">开奖结果</div>
                    <div class="col-kill" style="text-align: center;">杀组预测</div>
                    <div class="col-result">结果</div>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <div id="scratchModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeScratchModal()">×</button>
            <div class="scratch-title" id="scratchTitle">最新期号：加载中...</div>
            <div class="scratch-container">
                <div class="scratch-prize">
                    <div class="scratch-nums-text" id="scratchNums">- + - + -</div>
                    <div class="scratch-result-text" id="scratchResult">未知</div>
                </div>
                <canvas id="scratch-canvas"></canvas>
            </div>
            <div class="scratch-bottom-countdown" id="scratchBottomCountdown">下期开奖还剩：--分--秒</div>
        </div>
    </div>

    <!-- ===== 音乐模块 ===== -->
    <audio id="bgm" loop preload="none"></audio>

    <div id="music-panel">
        <div class="player-card">
            <div class="player-cover" id="playerCover">
                <img src="start.jpg" onerror="this.outerHTML='<span style=\'font-size:28px;\'>🎵</span>'">
            </div>
            <div class="player-info">
                <div class="player-title" id="playerTitle">伏线</div>
                <div class="player-artist" id="playerArtist">—</div>
                <div class="player-lyric">Tactical calibrate and see from every colour</div>
            </div>
        </div>
        <div class="music-progress-row">
            <span class="music-progress-time" id="curTime">00:00</span>
            <div class="music-progress-bar" id="progressBar">
                <div class="music-progress-fill" id="progressFill"></div>
            </div>
            <span class="music-progress-time" id="durTime">00:00</span>
        </div>
        <div class="music-controls">
            <button class="music-ctrl-btn" id="loopBtn" title="循环">🔁</button>
            <button class="music-ctrl-btn" id="prevBtn" title="上一首">⏮</button>
            <button class="music-ctrl-btn play-pause" id="playPauseBtn" title="播放/暂停">▶</button>
            <button class="music-ctrl-btn" id="nextBtn" title="下一首">⏭</button>
            <button class="music-ctrl-btn" id="listBtn" title="列表">🎵</button>
        </div>
        <div class="music-playlist" id="playlist"></div>
    </div>

    <div id="music-btn" onclick="toggleMusicPanel()">
        <img class="avatar" id="musicAvatar" src="start.jpg" onerror="this.outerHTML='<span style=\'font-size:24px;\'>🎵</span>'">
    </div>

    <script>
        // ================= 歌单 =================
        const MUSIC_LIST = [
            { id: '3374282887', name: '伏线',       artist: '—' },
            { id: '25640778',  name: '会呼吸的痛', artist: '—' },
            { id: '1454723856', name: '某年某月某天', artist: '雨宗林' }
        ];

        let currentMusicIndex = 0;
        let isMusicPlaying = false;
        let isLoop = true;
        let isDragging = false;

        const audio = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-btn');
        const playerCover = document.getElementById('playerCover');
        const musicPanel = document.getElementById('music-panel');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const loopBtn = document.getElementById('loopBtn');
        const playlistEl = document.getElementById('playlist');

        function formatTime(t) {
            if (isNaN(t) || !isFinite(t)) return '00:00';
            const m = Math.floor(t / 60), s = Math.floor(t % 60);
            return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function renderPlaylist() {
            playlistEl.innerHTML = MUSIC_LIST.map((song, i) => `
                <div class="music-list-item ${i === currentMusicIndex && isMusicPlaying ? 'list-active' : ''}" data-idx="${i}">
                    <div class="list-cover">
                        <img src="start.jpg" onerror="this.outerHTML='<span style=\'font-size:16px;\'>🎵</span>'">
                    </div>
                    <span class="list-name">${song.name}</span>
                    <div class="list-playing"><span></span><span></span><span></span></div>
                </div>
            `).join('');
            playlistEl.querySelectorAll('.music-list-item').forEach(item => {
                item.onclick = (e) => {
                    e.stopPropagation();
                    loadSong(parseInt(item.dataset.idx));
                };
            });
        }

        function loadSong(index) {
            currentMusicIndex = index;
            const song = MUSIC_LIST[index];
            progressFill.style.width = '0%';
            curTimeEl.textContent = '00:00';
            audio.src = `https://music.163.com/song/media/outer/url?id=${song.id}.mp3`;
            playerTitle.textContent = song.name;
            playerArtist.textContent = song.artist;
            audio.play().then(() => {
                isMusicPlaying = true;
                musicBtn.classList.add('playing');
                playerCover.classList.add('spinning');
                playPauseBtn.textContent = '⏸';
                loopBtn.classList.toggle('active', isLoop);
            }).catch(() => {
                audio.src = `https://api.injahow.cn/meting/?type=url&id=${song.id}`;
                audio.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.classList.add('playing');
                    playerCover.classList.add('spinning');
                    playPauseBtn.textContent = '⏸';
                }).catch(() => { alert('播放失败'); });
            });
            renderPlaylist();
        }

        function togglePlay() {
            if (isMusicPlaying) {
                audio.pause();
                isMusicPlaying = false;
                musicBtn.classList.remove('playing');
                playerCover.classList.remove('spinning');
                playPauseBtn.textContent = '▶';
            } else {
                if (audio.src) {
                    audio.play().then(() => {
                        isMusicPlaying = true;
                        musicBtn.classList.add('playing');
                        playerCover.classList.add('spinning');
                        playPauseBtn.textContent = '⏸';
                    }).catch(() => loadSong(currentMusicIndex));
                } else {
                    loadSong(currentMusicIndex);
                }
            }
            renderPlaylist();
        }

        function toggleMusicPanel() {
            musicPanel.classList.toggle('show');
        }

        // 进度条拖动
        function seekFromEvent(e) {
            if (!audio.duration || !isFinite(audio.duration)) return;
            const rect = progressBar.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let pct = (clientX - rect.left) / rect.width;
            pct = Math.max(0, Math.min(1, pct));
            audio.currentTime = pct * audio.duration;
            progressFill.style.width = (pct * 100) + '%';
            curTimeEl.textContent = formatTime(audio.currentTime);
        }
        function onDown(e) { isDragging = true; seekFromEvent(e); e.preventDefault(); }
        function onMove(e) { if (!isDragging) return; seekFromEvent(e); e.preventDefault(); }
        function onUp() { isDragging = false; }

        progressBar.addEventListener('mousedown', onDown);
        progressBar.addEventListener('touchstart', onDown, { passive: false });
        document.addEventListener('mousemove', onMove);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchend', onUp);

        audio.addEventListener('timeupdate', () => {
            if (isDragging) return;
            if (audio.duration && isFinite(audio.duration)) {
                progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
                curTimeEl.textContent = formatTime(audio.currentTime);
                durTimeEl.textContent = formatTime(audio.duration);
            }
        });
        audio.addEventListener('loadedmetadata', () => { durTimeEl.textContent = formatTime(audio.duration); });
        audio.addEventListener('ended', () => { if (!isLoop) loadSong((currentMusicIndex + 1) % MUSIC_LIST.length); });

        playPauseBtn.onclick = togglePlay;
        document.getElementById('prevBtn').onclick = () => loadSong((currentMusicIndex - 1 + MUSIC_LIST.length) % MUSIC_LIST.length);
        document.getElementById('nextBtn').onclick = () => loadSong((currentMusicIndex + 1) % MUSIC_LIST.length);
        loopBtn.onclick = () => { isLoop = !isLoop; audio.loop = isLoop; loopBtn.classList.toggle('active', isLoop); };
        document.getElementById('listBtn').onclick = () => { playlistEl.style.display = playlistEl.style.display === 'none' ? 'block' : 'none'; };

        document.addEventListener('click', (e) => {
            if (!musicPanel.contains(e.target) && !musicBtn.contains(e.target)) {
                musicPanel.classList.remove('show');
            }
        });

        // 初始化
        audio.src = `https://music.163.com/song/media/outer/url?id=${MUSIC_LIST[0].id}.mp3`;
        playerTitle.textContent = MUSIC_LIST[0].name;
        playerArtist.textContent = MUSIC_LIST[0].artist;
        loopBtn.classList.add('active');
        audio.loop = true;
        renderPlaylist();

        // ================= 进入系统 =================
        function enterSystem() {
            var sp = document.getElementById('splash-screen');
            var ma = document.getElementById('main-app');
            if(!sp || !ma) return;
            sp.style.opacity = '0';
            sp.style.pointerEvents = 'none';
            ma.style.display = 'flex';
            setTimeout(function(){ sp.style.display = 'none'; }, 400);
            if(typeof fetchData === 'function') fetchData();
        }

        // ================= 刮奖 =================
        let latestDrawInfo = null;
        let canvas, ctx, isDrawing = false, isFinished = false, lastX = 0, lastY = 0;

        function openScratchModal() {
            if (!latestDrawInfo) { alert("数据还在加载中，请稍候..."); return; }
            document.getElementById('scratchTitle').textContent = `最新期号：${latestDrawInfo.nbr}`;
            document.getElementById('scratchNums').innerHTML = latestDrawInfo.numsStr;
            document.getElementById('scratchResult').textContent = latestDrawInfo.combo;
            document.getElementById('scratchModal').classList.add('show');
            updateCountdownDisplay();
            resetScratchCanvas();
        }

        function closeScratchModal() { document.getElementById('scratchModal').classList.remove('show'); }

        function resetScratchCanvas() {
            canvas = document.getElementById('scratch-canvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('刮开涂层', canvas.width/2, canvas.height/2);
            isFinished = false;
            bindEvents();
        }

        function bindEvents() {
            canvas.onmousedown = startDrawing; canvas.onmousemove = draw; canvas.onmouseup = stopDrawing; canvas.onmouseout = stopDrawing;
            canvas.ontouchstart = (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousedown", { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); };
            canvas.ontouchmove = (e) => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent("mousemove", { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); };
            canvas.ontouchend = () => { canvas.dispatchEvent(new MouseEvent("mouseup")); };
        }

        function getPos(e) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

        function startDrawing(e) { if (isFinished) return; isDrawing = true; const pos = getPos(e); lastX = pos.x; lastY = pos.y; draw(e); }

        function draw(e) {
            if (!isDrawing || isFinished) return;
            const pos = getPos(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath(); ctx.arc(pos.x, pos.y, 20, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 40; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            lastX = pos.x; lastY = pos.y; checkScratchPercentage();
        }

        function stopDrawing() { isDrawing = false; }

        function checkScratchPercentage() {
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let transparent = 0;
            for (let i = 3; i < pixels.length; i += 4) if (pixels[i] === 0) transparent++;
            if ((transparent / (pixels.length / 4)) * 100 > 50) { ctx.clearRect(0, 0, canvas.width, canvas.height); isFinished = true; if (navigator.vibrate) navigator.vibrate(50); }
        }

        // ================= 数据 =================
        const API_URL = 'https://pc28.help/api/kj.json?nbr=300';
        let countdownTimer = null, targetTimestamp = 0, lastIssueNumber = "";

        function updateCountdownDisplay() {
            if (targetTimestamp === 0) return;
            const remaining = Math.max(0, Math.floor((targetTimestamp - Date.now()) / 1000));
            const timeStr = remaining <= 0 ? '00分00秒' : `${Math.floor(remaining/60)}分${String(remaining%60).padStart(2,'0')}秒`;
            const mainEl = document.getElementById('countdown');
            if (mainEl) { mainEl.textContent = timeStr; mainEl.classList.toggle('urgent', remaining <= 30); }
            const modalEl = document.getElementById('scratchBottomCountdown');
            if (modalEl) { modalEl.textContent = `下期开奖还剩：${timeStr}`; modalEl.style.color = remaining <= 30 ? '#f97316' : '#22c55e'; }
        }

        function startLocalCountdown(initialSeconds) {
            if (countdownTimer) clearInterval(countdownTimer);
            targetTimestamp = Date.now() + initialSeconds * 1000;
            updateCountdownDisplay();
            countdownTimer = setInterval(() => {
                const remaining = Math.floor((targetTimestamp - Date.now()) / 1000);
                updateCountdownDisplay();
                if (remaining <= 0) { clearInterval(countdownTimer); countdownTimer = null; fetchData(); }
            }, 1000);
        }

        function calculateKill(numArr) {
            const sum = numArr[0] + numArr[1] + numArr[2];
            const lastDigit = sum % 10;
            const calcVal = numArr[0] + numArr[2] + lastDigit;
            const isBig = calcVal >= 14;
            const isOdd = calcVal % 2 !== 0;
            let combo = (isBig ? '大' : '小') + (isOdd ? '单' : '双');
            let kill = "";
            if (combo === '大双') kill = '杀小单';
            else if (combo === '大单') kill = '杀小双';
            else if (combo === '小双') kill = '杀大单';
            else if (combo === '小单') kill = '杀大双';
            return { calcVal, combo, kill, sum };
        }

        function toBoldNum(str) {
            const map = {'0':'𝟬','1':'𝟭','2':'𝟮','3':'𝟯','4':'𝟰','5':'𝟱','6':'𝟲','7':'𝟳','8':'𝟴','9':'𝟵'};
            return String(str).split('').map(c => map[c] || c).join('');
        }

        function renderStats(dataList) {
            let win = 0, lose = 0, html = "", currentStreak = 0, isStreakBroken = false;
            for (let i = 0; i < 50; i++) {
                if (i + 1 >= dataList.length) break;
                const predictItem = dataList[i + 1], actualItem = dataList[i];
                const pNums = predictItem.number.split('+').map(Number);
                const aNums = actualItem.number.split('+').map(Number);
                const predictIssue = Number(predictItem.nbr) + 1;
                const calc = calculateKill(pNums);
                const killTarget = calc.kill.substring(1);
                const aSum = actualItem.num || aNums.reduce((a,b)=>a+b,0);
                const actualCombo = (aSum >= 14 ? '大' : '小') + (aSum % 2 === 0 ? '双' : '单');
                const isWin = killTarget !== actualCombo;
                if (!isStreakBroken) { if (isWin) currentStreak++; else isStreakBroken = true; }
                if (isWin) win++; else lose++;
                html += `<div class="history-row">
                    <div class="col-issue">${predictIssue}</div>
                    <div class="col-actual">${actualCombo}</div>
                    <div class="col-kill">${calc.kill}</div>
                    <div class="col-result ${isWin ? 'tag-win' : 'tag-lose'}">${isWin ? '杀对' : '杀错'}</div>
                </div>`;
            }
            document.getElementById('historyList').innerHTML = html;
            document.getElementById('winCount').textContent = win;
            document.getElementById('loseCount').textContent = lose;
            document.getElementById('topStreak').textContent = currentStreak;
            document.getElementById('headerStreak').textContent = `连中: ${currentStreak} 期`;
            const total = win + lose;
            if (total > 0) document.getElementById('accuracy').textContent = `胜率: ${((win/total)*100).toFixed(1)}%`;
        }

        async function fetchData() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = '正在获取...';
            try {
                const res = await fetch(API_URL + '&_t=' + Date.now(), { cache: 'no-store' });
                const json = await res.json();
                const dataList = json.data;
                if (!dataList || dataList.length === 0) throw new Error('无数据');

                const latest = dataList[0];
                lastIssueNumber = latest.nbr;
                document.getElementById('issue').textContent = latest.nbr;

                const nums = latest.number.split('+').map(Number);
                const sum = latest.num || nums.reduce((a,b)=>a+b,0);
                const combo = latest.combination || ((sum >= 14 ? '大' : '小') + (sum % 2 === 0 ? '双' : '单'));
                document.getElementById('nums').innerHTML = `${toBoldNum(nums[0])} + ${toBoldNum(nums[1])} + ${toBoldNum(nums[2])} <span>= ${toBoldNum(sum)}</span>`;

                const nextNbr = Number(latest.nbr) + 1;
                document.getElementById('nextIssue').textContent = nextNbr + ' 期';
                const calc = calculateKill(nums);
                document.getElementById('killTarget').textContent = calc.kill;

                renderStats(dataList);

                const cdStr = json.countdown || '00:00';
                const parts = cdStr.split(':').map(Number);
                const cdSec = parts.length === 2 ? parts[0]*60 + parts[1] : 5*60;
                startLocalCountdown(cdSec);

                latestDrawInfo = { nbr: latest.nbr, numsStr: `${nums[0]} + ${nums[1]} + ${nums[2]} = ${sum}`, combo: combo };

                const modalEl = document.getElementById('scratchModal');
                if (modalEl.classList.contains('show')) {
                    document.getElementById('scratchTitle').textContent = `最新期号：${latest.nbr}`;
                    document.getElementById('scratchNums').innerHTML = latestDrawInfo.numsStr;
                    document.getElementById('scratchResult').textContent = combo;
                    resetScratchCanvas();
                }

                statusEl.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
            } catch (err) {
                statusEl.textContent = '获取失败，请重试';
                console.error(err);
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && targetTimestamp > 0) {
                if (Date.now() >= targetTimestamp) fetchData();
                else updateCountdownDisplay();
            }
        });

        fetchData();
    </script>
</body>
</html>
